<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Microsoft Weather Application</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}
:root{--bg:radial-gradient(ellipse at 50% 35%,rgba(210,216,222,.18),transparent 55%),linear-gradient(#566069,#2c3238 55%,#14171a);--win:rgba(33,36,41,.95);--bar:#2b2f35;--txt:#f0f2f4;--sub:#aeb6bf;--line:rgba(255,255,255,.14);--acc:#5ea2e8;--acct:#0a1219;--dock:rgba(15,17,19,.88);--panel:rgba(15,17,19,.94);--ctxt:#fff;--csub:#d5dbe1}
[data-theme=light]{--bg:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.5),transparent 55%),linear-gradient(#e8ecef,#c2cad1 55%,#9aa4ac);--win:rgba(250,251,252,.95);--bar:#e4e8ec;--txt:#16191c;--sub:#4a535c;--line:rgba(0,0,0,.14);--acc:#0b5cad;--acct:#fff;--dock:rgba(240,243,246,.9);--panel:rgba(240,243,246,.94);--ctxt:#14171a;--csub:#2f373e}
html,body{margin:0;height:100%}
body{background:var(--bg) fixed;color:var(--txt);font-family:Cantarell,'Noto Sans','Segoe UI',system-ui,sans-serif;display:grid;grid-template-columns:56px 340px 1fr 380px;grid-template-rows:1fr 28px;overflow:hidden}
.mono,.win header,.kv,#hourly{font-family:'Source Code Pro',ui-monospace,Menlo,monospace}
nav{align-self:center;display:flex;flex-direction:column;gap:6px;padding:8px 4px;background:var(--dock);border-radius:0 8px 8px 0;width:44px}
nav button{width:36px;height:36px;border:0;border-radius:6px;background:transparent;color:var(--txt);font-size:18px;cursor:pointer}
nav button:hover{background:var(--line)}
.col{display:flex;flex-direction:column;gap:16px;padding:16px;min-height:0}
.win{display:flex;flex-direction:column;overflow:hidden;border-radius:6px;background:var(--win);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35);min-height:0}
.win header{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--bar);font-size:12px;color:var(--sub)}
.dots i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--sub);opacity:.55;margin-left:6px}
.body{flex:1;min-height:0;padding:12px 14px;overflow:auto}
input{width:100%;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--txt);font:inherit;font-size:13px}
.btn{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--txt);font:inherit;font-size:13px;cursor:pointer}
.btn.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
.bar{display:flex;gap:8px;margin:10px 0}
.row{display:flex;justify-content:space-between;padding:4px 10px;border-radius:4px;font-size:14px}
.row.on{background:var(--acc);color:var(--acct)}
.lnk{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left;padding:3px 0}
#hourly,.kv{font-size:13px;line-height:1.75;white-space:pre-wrap}
.prompt{color:var(--acc)}
.sub{color:var(--sub)}
.kv{display:flex;gap:12px}
.kv b{width:92px;flex:none;color:var(--acc)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;min-width:0;color:var(--ctxt)}
#city{font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--csub)}
#temp{font-size:clamp(90px,12vw,150px);font-weight:200;line-height:1.05}
#cond{font-size:26px;font-weight:300;color:var(--csub)}
#date{font-size:22px;font-weight:300;color:var(--csub);margin-top:6px}
#week{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:40px}
.day{width:62px}
.day small{font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;color:var(--csub)}
.day span{display:block;font-size:11px;min-height:30px;margin:6px 0;color:var(--csub)}
.day b{display:block;font-size:15px;font-weight:400}
.day i{font-style:normal;font-size:13px;color:var(--csub)}
#map{height:100%;min-height:180px;border-radius:4px}
footer{grid-column:1/5;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--panel);font-size:12px}
</style>
</head>
<body>
<nav aria-label="Main">
<button id="refresh" aria-label="Refresh">&#8635;</button>
<button id="theme" aria-label="Switch light or dark mode">&#9680;</button>
</nav>

<div class="col">
<section class="win" style="flex:1.2"><header><span>locations</span><span class="dots"><i></i><i></i><i></i></span></header>
<div class="body">
<form id="form"><input id="q" aria-label="Search for a city" placeholder="Search for a city"></form>
<div class="bar"><button class="btn" id="loc" style="flex:1">Use my location</button><button class="btn" id="c">°C</button><button class="btn" id="f">°F</button></div>
<div class="mono sub" style="font-size:12px;margin:4px 0">FAVOURITES</div>
<div id="favs"></div>
<button class="btn" id="save" style="margin-top:8px">Save current city</button>
</div></section>
<section class="win" style="flex:1"><header><span>hourly</span><span class="dots"><i></i><i></i><i></i></span></header>
<div class="body" id="hourly"></div></section>
</div>

<div class="center">
<div id="city">Loading...</div>
<div id="temp">--°</div>
<div id="cond"></div>
<div id="date"></div>
<div id="week"></div>
</div>

<div class="col">
<section class="win" style="flex:1.1"><header><span>radar</span><span class="dots"><i></i><i></i><i></i></span></header>
<div class="body" style="display:flex;flex-direction:column;gap:8px">
<div><button class="btn" id="play">Play</button></div>
<div style="flex:1;min-height:0"><div id="map"></div></div>
</div></section>
<section class="win" style="flex:1"><header><span>details</span><span class="dots"><i></i><i></i><i></i></span></header>
<div class="body" id="details"></div></section>
</div>

<footer class="mono"><span>Microsoft Weather Application</span><span id="updated"></span><span id="mode"></span></footer>

<script>
const $=s=>document.querySelector(s);
const st=JSON.parse(localStorage.getItem('wx')||'{}');
let S={theme:st.theme||'dark',unit:st.unit||'C',favs:st.favs||[],cur:st.cur||null};
const save=()=>localStorage.setItem('wx',JSON.stringify(S));
const WC={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Thunderstorm, hail'};
const wc=c=>WC[c]||'Unknown';
const T=c=>Math.round(S.unit==='F'?c*9/5+32:c)+'°';
let W=null,lastAlert='';

function applyTheme(){
  document.documentElement.dataset.theme=S.theme;
  $('#mode').textContent=S.theme==='dark'?'Dark mode':'Light mode';
  if(base)base.setUrl(baseUrl());
}
function unitBtns(){$('#c').classList.toggle('on',S.unit==='C');$('#f').classList.toggle('on',S.unit==='F')}

function favs(){
  const el=$('#favs');el.innerHTML='';
  S.favs.forEach((p,i)=>{
    const r=document.createElement('div');
    r.className='row'+(S.cur&&p.name===S.cur.name?' on':'');
    const a=document.createElement('button');a.className='lnk';a.textContent=p.name;a.onclick=()=>load(p);
    const x=document.createElement('button');x.className='lnk';x.textContent='×';x.setAttribute('aria-label','Remove '+p.name);
    x.onclick=()=>{S.favs.splice(i,1);save();favs()};
    r.append(a,x);el.append(r);
  });
}

function render(){
  const d=W,c=d.current;
  $('#city').textContent=S.cur.name;
  $('#temp').textContent=T(c.temperature_2m);
  $('#cond').textContent=wc(c.weather_code)+' · Feels like '+T(c.apparent_temperature);
  $('#date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('#week').innerHTML=d.daily.time.map((t,i)=>`<div class="day"><small>${new Date(t+'T12:00').toLocaleDateString(undefined,{weekday:'short'}).toUpperCase()}</small><span>${wc(d.daily.weather_code[i])}</span><b>${T(d.daily.temperature_2m_max[i])}</b><i>${T(d.daily.temperature_2m_min[i])}</i></div>`).join('');
  const i0=Math.max(0,d.hourly.time.findIndex(t=>t>=c.time));
  $('#hourly').innerHTML='<div class="prompt">$ hourly --next 6</div>'+[0,1,2,3,4,5].map(k=>{const i=i0+k;return `<div><span class="sub">${d.hourly.time[i].slice(11,16)}</span> <b>${T(d.hourly.temperature_2m[i])}</b>  ${wc(d.hourly.weather_code[i])}</div>`}).join('');
  const alert=c.weather_code>=95?'Thunderstorm expected':c.wind_gusts_10m>=60?'Strong wind gusts':'None';
  const kv=[['Alert',alert],['Feels like',T(c.apparent_temperature)],['Wind',Math.round(c.wind_speed_10m)+' km/h'],['Gusts',Math.round(c.wind_gusts_10m)+' km/h'],['Humidity',c.relative_humidity_2m+'%'],['Pressure',Math.round(c.pressure_msl)+' hPa'],['UV index',Math.round(d.daily.uv_index_max[0])],['Sunrise',d.daily.sunrise[0].slice(11,16)],['Sunset',d.daily.sunset[0].slice(11,16)]];
  $('#details').innerHTML=kv.map(([k,v])=>`<div class="kv"><b>${k}</b><span>${v}</span></div>`).join('');
  if(alert!=='None'&&lastAlert!==alert+S.cur.name){
    lastAlert=alert+S.cur.name;
    try{new Notification('Weather alert',{body:alert+' in '+S.cur.name})}catch(e){}
  }
  favs();
}

async function load(place){
  S.cur=place;save();
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m,relative_humidity_2m,pressure_msl&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7`;
    const r=await fetch(u);if(!r.ok)throw 0;
    W=await r.json();
    localStorage.setItem('wxd',JSON.stringify({place,d:W}));
    render();
    $('#updated').textContent='Updated '+new Date().toTimeString().slice(0,5);
    radar(place);
  }catch(e){
    const k=JSON.parse(localStorage.getItem('wxd')||'null');
    if(k){W=k.d;S.cur=k.place;render();$('#updated').textContent='Offline: showing last forecast'}
    else $('#cond').textContent='Could not load weather. Check your connection.';
  }
}

async function locate(){
  try{
    const r=await (await fetch('https://ipwho.is/')).json();
    if(!r.success)throw 0;
    load({name:r.city+', '+r.country,lat:r.latitude,lon:r.longitude});
  }catch(e){$('#cond').textContent='Could not find your location. Search for a city.'}
}

let map,base,rl,host,frames=[],fi=0,timer;
const baseUrl=()=>`https://{s}.basemaps.cartocdn.com/${S.theme}_all/{z}/{x}/{y}{r}.png`;
const tile=()=>host+frames[fi].path+'/256/{z}/{x}/{y}/2/1_1.png';
async function radar(p){
  if(!window.L)return;
  if(map){map.setView([p.lat,p.lon],6);return}
  map=L.map('map').setView([p.lat,p.lon],6);
  base=L.tileLayer(baseUrl(),{subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'}).addTo(map);
  try{
    const r=await (await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
    host=r.host;frames=r.radar.past.concat(r.radar.nowcast);fi=r.radar.past.length-1;
    rl=L.tileLayer(tile(),{opacity:.7,maxNativeZoom:7}).addTo(map);
  }catch(e){}
}
$('#play').onclick=()=>{
  if(!rl)return;
  if(timer){clearInterval(timer);timer=null;$('#play').textContent='Play';return}
  $('#play').textContent='Pause';
  timer=setInterval(()=>{fi=(fi+1)%frames.length;rl.setUrl(tile())},700);
};

$('#form').onsubmit=async e=>{
  e.preventDefault();
  const q=$('#q').value.trim();if(!q)return;
  try{
    const r=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(q))).json();
    const p=r.results&&r.results[0];
    if(!p){$('#cond').textContent='City not found.';return}
    load({name:p.name+(p.country?', '+p.country:''),lat:p.latitude,lon:p.longitude});
    $('#q').value='';
  }catch(err){$('#cond').textContent='Search failed. Check your connection.'}
};
$('#loc').onclick=locate;
$('#refresh').onclick=()=>S.cur&&load(S.cur);
$('#save').onclick=()=>{if(S.cur&&!S.favs.some(f=>f.name===S.cur.name)){S.favs.push(S.cur);save();favs()}};
$('#c').onclick=()=>{S.unit='C';save();unitBtns();if(W)render()};
$('#f').onclick=()=>{S.unit='F';save();unitBtns();if(W)render()};
$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();applyTheme()};

applyTheme();unitBtns();favs();
try{Notification.requestPermission()}catch(e){}
S.cur?load(S.cur):locate();
</script>
</body>
</html>
